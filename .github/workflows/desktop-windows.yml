name: Desktop Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build .exe / portable
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Instalar pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.34.4
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build LLM + core + desktop + electron-builder
        run: |
          pnpm --filter @codingpro/llm build
          pnpm --filter @codingpro/core build
          pnpm --filter @codingpro/desktop dist

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: codingpro-windows
          path: |
            packages/desktop/.pack/release/*.exe
            packages/desktop/.pack/release/*.blockmap
          if-no-files-found: error

      - name: Criar GitHub Release (tags desktop-v*)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/.pack/release/*.exe
            packages/desktop/.pack/release/*.blockmap
          generate_release_notes: true
