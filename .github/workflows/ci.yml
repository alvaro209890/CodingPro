name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.11
          - os: macos-latest
            node: 24.18.0
          - os: ubuntu-latest
            node: 24.18.0

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Instalar pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.34.4
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar lint, tipos, testes, cobertura e build
        run: env -u DEEPSEEK_API_KEY -u CODINGPRO_REAL_SMOKE pnpm check
